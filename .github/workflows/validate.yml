name: Validate

on:
  push:
  pull_request:
  schedule:
    # Nightly, so a new Home Assistant or HACS rule surfaces before a release.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The brand images arrive with the built-in integration, which
          # replaces this one; this repository never joins the HACS list.
          ignore: brands
